openapi: 3.0.3
info:
  title: API Europolis
  description: Europolis Game API. Specificatia include operatiile implementate in etapa curenta si extensiile planificate pentru sprintul urmator.
  version: 0.3.0

servers:
  - url: http://localhost:8080
    description: Server local PHP

paths:

# ─────────────────────────────────────────
# GAMES
# ─────────────────────────────────────────

  /games:
    get:
      summary: Returneaza lista jocurilor existente
      tags: [Games]
      x-implementation-status: implemented
      responses:
        '200':
          description: Lista jocurilor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameListItem'
    post:
      summary: Creează un joc nou
      tags: [Games]
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostName, maxPlayers]
              properties:
                hostName:
                  type: string
                  example: Ana
                maxPlayers:
                  type: integer
                  minimum: 2
                  maximum: 6
                  example: 4
      responses:
        '201':
          description: Joc creat cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameWithPlayers'
        '400':
          $ref: '#/components/responses/BadRequest'

  /games/{gameId}:
    get:
      summary: Obține starea curentă a jocului
      tags: [Games]
      parameters:
        - $ref: '#/components/parameters/gameId'
      responses:
        '200':
          description: Starea curentă a jocului
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameWithPlayers'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Modifică starea jocului (ex. pornire, finalizare)
      tags: [Games]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/gameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, finished]
                  example: active
      responses:
        '200':
          description: Joc actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Sterge un joc
      description: Stergerea jocului elimina si jucatorii si datele dependente prin baza de date.
      tags: [Games]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/gameId'
      responses:
        '200':
          description: Joc sters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGameResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────
# PLAYERS
# ─────────────────────────────────────────

  /games/{gameId}/players:
    post:
      summary: Adaugă un jucător în joc
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/gameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Mihai
      responses:
        '201':
          description: Jucător adăugat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: Returnează lista jucătorilor din joc
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/gameId'
      responses:
        '200':
          description: Lista jucătorilor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/players/{playerId}:
    get:
      summary: Returnează detaliile unui jucător din joc
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: Detalii jucător
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetailed'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Expulzează un jucător din joc (doar Host, înainte de pornire)
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '204':
          description: Jucător eliminat cu succes
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/players/{playerId}/leave:
    post:
      summary: Jucătorul iese voluntar din joc
      x-implementation-status: planned
      description: >
        Un jucător activ poate părăsi jocul în orice moment. 
        Dacă jocul este în starea `waiting`, jucătorul este pur și simplu eliminat din listă.
        Dacă jocul este `active`, jucătorul este marcat `bankrupt`, proprietățile sale sunt
        redistribuite băncii, iar jocul continuă. Dacă rămâne un singur jucător activ,
        jocul se termină automat (status `finished`).
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: Jucătorul a ieșit din joc
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jucătorul a părăsit jocul.
                  gameStatus:
                    type: string
                    enum: [waiting, active, finished]
                    example: active
                  game:
                    $ref: '#/components/schemas/GameWithPlayers'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /players/{playerId}:
    get:
      summary: Returnează detaliile unui jucător după id
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: Detalii jucător
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetailed'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Actualizează statusul unui jucător (ex. faliment)
      tags: [Players]
      parameters:
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, bankrupt]
                  example: bankrupt
      responses:
        '200':
          description: Jucător actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────
# TURNS
# ─────────────────────────────────────────

  /games/{gameId}/turns:
    get:
      summary: Returnează lista turelor dintr-un joc
      tags: [Turns]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - name: playerId
          in: query
          required: false
          schema:
            type: integer
          description: Filtrează turele după jucător
          example: 2
      responses:
        '200':
          description: Lista turelor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turn'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Inițiază o tură și aruncă zarurile
      tags: [Turns]
      parameters:
        - $ref: '#/components/parameters/gameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId:
                  type: integer
                  example: 2
      responses:
        '201':
          description: Tură inițiată
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /games/{gameId}/turns/{turnId}:
    get:
      summary: Returnează detaliile unei ture
      tags: [Turns]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/turnId'
      responses:
        '200':
          description: Detalii tură
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────
# ACTIONS
# ─────────────────────────────────────────

  /games/{gameId}/turns/{turnId}/actions:
    get:
      summary: Returnează acțiunile executate într-o tură
      tags: [Actions]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/turnId'
      responses:
        '200':
          description: Lista acțiunilor din tură
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionRecord'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Execută o acțiune în cadrul turei curente
      tags: [Actions]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/turnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType]
              properties:
                actionType:
                  type: string
                  enum: [buy_property, pay_rent, pay_tax, end_turn, use_card, mortgage_property, unmortgage_property, build_house, build_hotel, declare_bankruptcy]
                  example: buy_property
                propertyId:
                  type: integer
                  description: Necesar pentru buy_property, mortgage_property, unmortgage_property, build_house, build_hotel
                  example: 15
      responses:
        '200':
          description: Acțiune executată
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

# ─────────────────────────────────────────
# PROPERTIES
# ─────────────────────────────────────────

  /games/{gameId}/properties:
    get:
      summary: Returnează toate proprietățile de pe tabla de joc
      tags: [Properties]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
          description: Filtrează după proprietar
          example: 2
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: Filtrează după grupul de culoare
          example: blue
      responses:
        '200':
          description: Lista proprietăților
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/properties/{propertyId}:
    get:
      summary: Returnează detaliile unei proprietăți
      tags: [Properties]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: Detalii proprietate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailed'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Actualizează starea unei proprietăți (ipotecare/deipotecare manuală)
      tags: [Properties]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mortgaged:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Proprietate actualizată
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}/properties/{propertyId}/sell:
    post:
      summary: Vinde o proprietate catre banca
      description: Jucatorul primeste jumatate din suma platita pentru proprietate.
      tags: [Properties]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Proprietate vanduta catre banca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellPropertyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/properties/{propertyId}/buildings:
    get:
      summary: Returnează clădirile de pe o proprietate
      tags: [Properties]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: Lista clădirilor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Construiește o casă sau hotel pe o proprietate
      tags: [Properties]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [house, hotel]
                  example: house
      responses:
        '201':
          description: Clădire construită
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}/properties/{propertyId}/buildings/{buildingId}:
    delete:
      summary: Demolează o clădire de pe o proprietate
      tags: [Properties]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/propertyId'
        - $ref: '#/components/parameters/buildingId'
      responses:
        '204':
          description: Clădire demolată, banii returnați
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

# ─────────────────────────────────────────
# TRADES
# ─────────────────────────────────────────

  /games/{gameId}/trades:
    get:
      summary: Returnează lista propunerilor de schimb dintr-un joc
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, rejected]
          description: Filtrează după status
          example: pending
      responses:
        '200':
          description: Lista trade-urilor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Creează o propunere de schimb
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/gameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromPlayerId, toPlayerId]
              properties:
                fromPlayerId:
                  type: integer
                  example: 1
                toPlayerId:
                  type: integer
                  example: 2
                offeredMoney:
                  type: integer
                  minimum: 0
                  example: 200
                offeredPropertyIds:
                  type: array
                  items:
                    type: integer
                  example: []
                requestedMoney:
                  type: integer
                  minimum: 0
                  example: 0
                requestedPropertyIds:
                  type: array
                  items:
                    type: integer
                  example: [14]
      responses:
        '201':
          description: Propunere creată
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/trades/{tradeId}:
    get:
      summary: Returnează detaliile unei propuneri de schimb
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/tradeId'
      responses:
        '200':
          description: Detalii trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Acceptă sau respinge o propunere de schimb
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/tradeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                  example: accepted
      responses:
        '200':
          description: Răspuns înregistrat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Anulează o propunere de schimb (doar inițiatorul, cât timp e pending)
      tags: [Trades]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/gameId'
        - $ref: '#/components/parameters/tradeId'
      responses:
        '204':
          description: Propunere anulată
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


# ─────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────

components:

  parameters:
    gameId:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
      example: 1
    playerId:
      name: playerId
      in: path
      required: true
      schema:
        type: integer
      example: 2
    turnId:
      name: turnId
      in: path
      required: true
      schema:
        type: integer
      example: 10
    tradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: integer
      example: 3
    propertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: integer
      example: 15
    buildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: integer
      example: 7

  schemas:

    GameListItem:
      type: object
      properties:
        id:
          type: integer
          example: 10
        status:
          type: string
          enum: [waiting, active, finished]
          example: active
        maxPlayers:
          type: integer
          example: 4
        playerCount:
          type: integer
          example: 2
        currentPlayerId:
          type: integer
          nullable: true
          example: 2
        currentPlayerName:
          type: string
          nullable: true
          example: Mihai
        createdAt:
          type: string
          example: "2026-05-20 02:06:20"

    Game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        status:
          type: string
          enum: [waiting, active, finished]
          example: active
        currentPlayerId:
          type: integer
          nullable: true
          example: 2
        maxPlayers:
          type: integer
          example: 4
        createdAt:
          type: string
          format: date-time
          example: "2026-03-15T10:00:00Z"

    GameWithPlayers:
      allOf:
        - $ref: '#/components/schemas/Game'
        - type: object
          properties:
            players:
              type: array
              items:
                $ref: '#/components/schemas/Player'

    Player:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Mihai
        balance:
          type: integer
          example: 1500
        position:
          type: integer
          example: 0
        status:
          type: string
          enum: [active, bankrupt]
          example: active
        isInJail:
          type: boolean
          example: false
        jailTurnsLeft:
          type: integer
          example: 0

    PlayerDetailed:
      allOf:
        - $ref: '#/components/schemas/Player'
        - type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/Property'
            getOutOfJailCards:
              type: integer
              description: Numărul de cărți „Ieșire din închisoare" deținute
              example: 0

    Turn:
      type: object
      properties:
        turnId:
          type: integer
          example: 10
        playerId:
          type: integer
          example: 2
        dice:
          type: array
          items:
            type: integer
          example: [3, 5]
        isDouble:
          type: boolean
          example: false
        fromPosition:
          type: integer
          example: 7
        toPosition:
          type: integer
          example: 15
        landedTile:
          $ref: '#/components/schemas/Tile'
        availableActions:
          type: array
          items:
            type: string
          example: [buy_property, end_turn]
        status:
          type: string
          enum: [in_progress, completed]
          example: in_progress

    Tile:
      type: object
      properties:
        index:
          type: integer
          example: 15
        name:
          type: string
          example: Brașov
        type:
          type: string
          enum: [property, tax, chance, community_chest, jail, go_to_jail, start, free_parking, railroad, utility]
          example: property

    Property:
      type: object
      properties:
        id:
          type: integer
          example: 15
        tileIndex:
          type: integer
          example: 15
        name:
          type: string
          example: Brașov
        group:
          type: string
          example: red
        price:
          type: integer
          example: 200
        rent:
          type: array
          items:
            type: integer
          description: Chirii pentru 0–4 case și hotel
          example: [16, 80, 220, 600, 800, 1000]
        houseCost:
          type: integer
          example: 150
        hotelCost:
          type: integer
          example: 150
        mortgageValue:
          type: integer
          example: 100
        mortgaged:
          type: boolean
          example: false
        ownerId:
          type: integer
          nullable: true
          example: 2
        buildingCount:
          type: integer
          description: Numărul de case (0–4) sau 5 pentru hotel
          example: 0

    PropertyDetailed:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          properties:
            buildings:
              type: array
              items:
                $ref: '#/components/schemas/Building'

    Building:
      type: object
      properties:
        id:
          type: integer
          example: 7
        propertyId:
          type: integer
          example: 15
        type:
          type: string
          enum: [house, hotel]
          example: house

    SellPropertyResponse:
      type: object
      properties:
        message:
          type: string
          example: Proprietate vanduta catre banca
        refund:
          type: integer
          example: 70
        soldProperty:
          type: object
          properties:
            tileIndex:
              type: integer
              example: 11
            name:
              type: string
              example: Sibiu
            purchasePrice:
              type: integer
              example: 140
        player:
          $ref: '#/components/schemas/Player'

    Trade:
      type: object
      properties:
        tradeId:
          type: integer
          example: 3
        fromPlayerId:
          type: integer
          example: 1
        toPlayerId:
          type: integer
          example: 2
        offeredMoney:
          type: integer
          example: 200
        offeredPropertyIds:
          type: array
          items:
            type: integer
          example: []
        requestedMoney:
          type: integer
          example: 0
        requestedPropertyIds:
          type: array
          items:
            type: integer
          example: [14]
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled]
          example: pending
        createdAt:
          type: string
          format: date-time
          example: "2026-03-15T10:05:00Z"

    ActionRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        turnId:
          type: integer
          example: 10
        actionType:
          type: string
          example: buy_property
        propertyId:
          type: integer
          nullable: true
          example: 15
        executedAt:
          type: string
          format: date-time
          example: "2026-03-15T10:03:00Z"

    ActionResult:
      type: object
      properties:
        message:
          type: string
          example: Action executed successfully
        gameStatus:
          type: string
          enum: [waiting, active, finished]
          example: active
        player:
          $ref: '#/components/schemas/Player'
        affectedProperty:
          $ref: '#/components/schemas/Property'
          nullable: true

    DeleteGameResponse:
      type: object
      properties:
        message:
          type: string
          example: Joc sters
        gameId:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: NOT_YOUR_TURN
        message:
          type: string
          example: Jucătorul nu poate acționa în afara turei sale.

  responses:
    BadRequest:
      description: Cerere invalidă sau incompletă
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acțiunea nu este permisă în contextul curent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resursa nu a fost găsită
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict de stare
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regula de business nu permite operația
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
